<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1224">
  <title>Kor Taşıyıcı</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1224; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0d1224; outline: none; }
    #durum { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #e6dfd0; font: 18px Georgia, serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="durum">Köz yakılıyor…</div>
  <script>
    // tam pencere tuval (Unity'nin varsayılan şablonu 960x600 sabit kutu, telefonda arayüzün üstü taşıyordu)
    var buildUrl = "Build";
    var s = document.createElement("script");
    s.src = buildUrl + "/f06d6ce8c28cf3908bcbafa53f71316c.loader.js";
    s.onload = function () {
      createUnityInstance(document.getElementById("unity-canvas"), {
        dataUrl: buildUrl + "/94446c8cccc61f8acd3b2323144c386e.data.unityweb",
        frameworkUrl: buildUrl + "/a4f05b85f02475f32fe17e47a05a3f8e.framework.js.unityweb",
        codeUrl: buildUrl + "/652345baf74ab84cb2ec86138e7a20a7.wasm.unityweb",
        companyName: "Otag",
        productName: "Kor Taşıyıcı",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (p) { document.getElementById("durum").textContent = "Köz yakılıyor… %" + Math.round(p * 100); })
      .then(function (u) { window.unityInstance = u; document.getElementById("durum").remove(); })
      .catch(function (m) { document.getElementById("durum").textContent = "Hata: " + m; });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
